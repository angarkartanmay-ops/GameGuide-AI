services:
  - type: web
    name: gameguide-bot
    runtime: node
    region: oregon
    plan: free
    rootDir: discord-bot
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # KEEPALIVE_URL — set to your Render public URL (https://<name>.onrender.com)
      # to keep the free instance from sleeping after 15 min idle.
      - key: KEEPALIVE_URL
        sync: false
      # Must match BOT_SERVICE_TOKEN in the Supabase edge function secrets.
      # Without it the chat-proxy buckets every Discord user in every guild
      # into a single IP bucket, and the whole bot shares one allowance.
      - key: BOT_SERVICE_TOKEN
        sync: false
      # Billing. Without the first two, /premium can only show links and
      # nobody who pays is granted anything.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PAYMENT_LINK
        sync: false
      - key: STRIPE_SERVER_PAYMENT_LINK
        sync: false
      - key: STRIPE_LIFETIME_PAYMENT_LINK
        sync: false
      # Price ids the webhook checks purchases against (see .env.example).
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_SERVER
        sync: false
      - key: STRIPE_PRICE_LIFETIME
        sync: false
      # Razorpay (India) — see .env.example for where each value comes from.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO
        sync: false
      - key: RAZORPAY_PLAN_SERVER
        sync: false
      # Lemon Squeezy (worldwide, merchant of record).
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMON_VARIANT_PRO
        sync: false
      - key: LEMON_VARIANT_SERVER
        sync: false
      - key: LEMON_VARIANT_LIFETIME
        sync: false
      - key: LEMON_CHECKOUT_PRO
        sync: false
      - key: LEMON_CHECKOUT_SERVER
        sync: false
      - key: LEMON_CHECKOUT_LIFETIME
        sync: false
      # /upgrade → website plans page (see .env.example).
      - key: UPGRADE_LINK_SECRET
        sync: false
      - key: REVIEW_LOGIN_EMAIL
        sync: false
      - key: REVIEW_LOGIN_PASSWORD
        sync: false
      - key: SITE_URL
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: STRIPE_PRICE_SERVER_YEARLY
        sync: false
      - key: RAZORPAY_PLAN_PRO_YEARLY
        sync: false
      - key: RAZORPAY_PLAN_SERVER_YEARLY
        sync: false
      - key: LEMON_VARIANT_PRO_YEARLY
        sync: false
      - key: LEMON_VARIANT_SERVER_YEARLY
        sync: false
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
