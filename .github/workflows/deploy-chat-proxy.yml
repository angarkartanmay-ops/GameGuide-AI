# Deploys the chat-proxy edge function to Supabase.
#
# Merging to main updates GitHub only; the live function changes when it is
# deployed. Stale deploys were one reason answers went out of date, so this
# deploys automatically when the function's code changes, and can also be
# run by hand: Actions tab → "Deploy chat-proxy" → Run workflow.
#
# One-time setup: add a repository secret named SUPABASE_ACCESS_TOKEN
# (Settings → Secrets and variables → Actions). Create the token at
# https://supabase.com/dashboard/account/tokens
name: Deploy chat-proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/chat-proxy/**'
      - '.github/workflows/deploy-chat-proxy.yml'

concurrency:
  group: deploy-chat-proxy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vtvjbjmquxqlrwwrmzya
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # JWT verification stays on (the default), as it is on the live function.
      - name: Deploy
        run: supabase functions deploy chat-proxy --project-ref "$PROJECT_REF"
