<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed: the platform applies its own mask. The mark stays inside
       the central 80% safe zone so no mask shape can clip it. -->
  <defs>
    <radialGradient id="g" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#c0985b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#c0985b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#07090d"/>
  <rect width="512" height="512" fill="url(#g)"/>
  <rect x="179.2" y="179.2" width="153.6" height="153.6" rx="10" fill="#c0985b" transform="rotate(45 256 256)"/>
  <rect x="223.7" y="223.7" width="64.5" height="64.5" rx="5" fill="#07090d" transform="rotate(45 256 256)"/>
</svg>
