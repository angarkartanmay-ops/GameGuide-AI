    <script>
      /* The site routes on the hash (/#terms). Payment-provider reviewers and
         crawlers type the plain path (/terms, /refund-policy): send those to
         the right page instead of the landing page. */
      (function () {
        var alias = { 'terms-and-conditions': 'terms', 'terms-of-service': 'terms', 'privacy-policy': 'privacy',
          'refund': 'refunds', 'refund-policy': 'refunds', 'cancellation': 'refunds', 'cancellation-policy': 'refunds',
          'shipping': 'delivery', 'shipping-policy': 'delivery', 'delivery-policy': 'delivery',
          'contact': 'contacts', 'contact-us': 'contacts', 'pricing': 'upgrade', 'plans': 'upgrade' };
        var p = location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
        var view = alias[p] || p;
        if (!location.hash && /^(about|terms|privacy|refunds|delivery|contacts|upgrade|chat)$/.test(view)) {
          location.replace('/#' + view);
        }
      })();
    </script>
    <script>
      /* Chrome fires beforeinstallprompt once, usually before the app has
         mounted. Keep the event (and stop the browser's own mini-infobar) so
         the Install button, when it appears, still has it. See useInstallPrompt. */
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__ggInstall = e; });

    <!-- Fonts are self-hosted (src/styles/fonts.css): no third-party stylesheet
         to wait for before the first paint. Steam serves the art; today's games
         come from shared. (the hand-picked fallback uses cdn., only if the daily
         list fails, so it gets no early connection). -->
    <link rel="preconnect" href="https://shared.akamai.steamstatic.com" />
    <!-- Today's landing games (src/site/daily.js): start the one request now,
         in parallel with the app bundle, when the landing will need it and
         the day's copy isn't already saved. Either way, as soon as the first
         game is known its art is asked for (the phone's 1x cover or the wide
         hero, the same files Hero.jsx picks), not after the bundle has run. -->
    <script>
      try {
        var h = location.hash.replace(/^#\/?/, '').toLowerCase();
        var c = JSON.parse(localStorage.getItem('gg.daily.v1') || 'null');
        var landing = h === 'landing' || (!h && sessionStorage.getItem('gg_entered') !== '1');
        var art = function (body) {
          var g = body && body.hero && body.hero[0];
          var ok = /^https:\/\/(shared|cdn)\.akamai\.steamstatic\.com\//;
          if (!g || !ok.test(g.hero) || !ok.test(g.cover)) return;
          [[g.cover.replace(/_2x(?=\.jpg)/, ''), '(max-width: 767px)'], [g.hero, '(min-width: 768px)']].forEach(function (a) {
            var l = document.createElement('link');
            l.rel = 'preload'; l.as = 'image'; l.href = a[0]; l.media = a[1]; l.fetchPriority = 'high';
            document.head.appendChild(l);
          });
        };
        if (landing) {
          // The landing chunk and what it imports (filled in at build time),
          // asked for now instead of after the entry has run.
          /*gg-landing-preload*/[].forEach(function (href) {
            var l = document.createElement('link');
            var css = /\.css$/.test(href);
            l.rel = css ? 'preload' : 'modulepreload';
            if (css) l.as = 'style';
            l.crossOrigin = '';
            l.href = href;
            document.head.appendChild(l);
          });
          if (c && c.day === new Date().toISOString().slice(0, 10)) {
            art(c.body);
          } else {
            window.__ggDaily = fetch('/api/trending-games')
              .then(function (r) { return r.ok ? r.json() : null; })
              .catch(function () { return null; });
            window.__ggDaily.then(art);
          }
        }
      } catch (e) { /* the landing fetches it itself */ }
    </script>
