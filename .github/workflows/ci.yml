name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suites
        run: npm test

      - name: Build Web Application
        run: npm run build

      # The bot is a separate package with its own lockfile, and the test suite
      # above only reaches the three files that happen to have no load-time
      # imports (quota, entitlements, billing-stripe). Nothing was parsing
      # index.js — 1,200 lines behind a `require('discord.js')` — so a syntax
      # error there could reach production untouched by a green CI run.
      - name: Install Bot Dependencies
        working-directory: discord-bot
        run: npm ci

      - name: Syntax-Check Bot
        working-directory: discord-bot
        run: npm run syntax-check
